<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="tallymoth">
  <title>tallymoth</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2a44"/>
      <stop offset="1" stop-color="#0f1729"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3a3"/>
      <stop offset="1" stop-color="#f2b45a"/>
    </linearGradient>
    <g id="half">
      <!-- swept upper wing -->
      <path d="M122 112 C 96 84, 52 60, 18 74 C 16 112, 44 146, 122 150 Z" fill="url(#wing)"/>
      <!-- smaller lower wing -->
      <path d="M122 146 C 90 148, 54 168, 62 204 C 92 214, 120 188, 122 160 Z" fill="url(#wing)" opacity=".8"/>
      <!-- feathered antenna -->
      <g fill="none" stroke="#ffe3a3" stroke-linecap="round">
        <path d="M121 92 C 112 70, 98 56, 80 48" stroke-width="5"/>
        <path d="M114 78 l-10 4 M104 66 l-11 3 M94 57 l-10 3" stroke-width="3.5"/>
      </g>
      <!-- tally strokes -->
      <g stroke="#1e2a44" stroke-width="7" stroke-linecap="round">
        <line x1="56" y1="96" x2="56" y2="126"/>
        <line x1="84" y1="104" x2="84" y2="134"/>
      </g>
    </g>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <use href="#half"/>
  <use href="#half" transform="translate(256 0) scale(-1 1)"/>
  <!-- the fifth tally: a strike across the four (behind the body) -->
  <line x1="32" y1="140" x2="224" y2="92" stroke="#fff3d6" stroke-width="7" stroke-linecap="round" opacity=".95"/>
  <!-- fuzzy body + head -->
  <ellipse cx="128" cy="148" rx="14" ry="52" fill="#fff3d6"/>
  <circle cx="128" cy="92" r="13" fill="#fff3d6"/>
</svg>
