# docker compose -f deploy/docker-compose.yml up -d     (needs .env: see .env.example)
# Plain HTTP on :8080. Put your own reverse proxy (TLS) in front and expose only
# /v1/events and /healthz. Port 8081 (private query API) is never published.
services:
  tallymoth:
    image: ghcr.io/javedh-dev/tallymoth:${TALLYMOTH_VERSION:-latest}
    build: {context: .., dockerfile: deploy/Dockerfile}   # `docker compose up --build` builds from source instead
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    stop_grace_period: 20s
    environment:
      TALLYMOTH_TRUST_PROXY: "1"        # client IP from X-Forwarded-For (rate limiting only, never stored)
      TALLYMOTH_TRUSTED_HOPS: "1"       # proxies in front of the container
      GOMEMLIMIT: 100MiB
      SCALEBAR_KEY: ${SCALEBAR_KEY:-}   # referenced as ${SCALEBAR_KEY} in config/tallymoth.yaml
    ports:
      - "${TALLYMOTH_BIND:-127.0.0.1}:${TALLYMOTH_PORT:-8080}:8080"
    volumes:
      - data:/data
      - ./config:/config:ro
    tmpfs: ["/tmp:size=64m"]
volumes: {data: {}}
