version: 2
project_name: tallymoth
builds:
  - main: ./cmd/tallymoth
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    format_overrides: [{goos: windows, formats: [zip]}]
    files: [LICENSE, README.md, deploy/config/tallymoth.yaml]
checksum: {name_template: checksums.txt}
